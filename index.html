<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz</title>
  <style>
    :root{--bg:#0b0f14;--card:#121a23;--text:#e8eef6;--muted:#9fb0c3;--accent:#4aa3ff;--ok:#2ecc71;--bad:#ff5c5c;--border:rgba(255,255,255,.10)}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:linear-gradient(180deg,#070a0e,#0b0f14 40%,#070a0e);color:var(--text);min-height:100vh;}
    .wrap{max-width:920px;margin:0 auto;padding:16px 14px 72px;}
    .card{background:rgba(18,26,35,.92);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 30px rgba(0,0,0,.35);overflow:hidden}
    .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.02)}
    .pill{padding:6px 10px;border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:13px}
    .pill strong{color:var(--text);font-weight:650}
    .title{font-size:18px;font-weight:750;letter-spacing:.2px}
    .content{padding:14px}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap}
    button{appearance:none;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);padding:12px 14px;border-radius:14px;font-size:16px;font-weight:650;cursor:pointer;flex:1;min-width:140px}
    button.primary{border-color:rgba(74,163,255,.55);background:rgba(74,163,255,.14)}
    button:disabled{opacity:.55;cursor:not-allowed}
    .qtext{font-size:18px;line-height:1.35;margin:10px 0 14px;white-space:pre-wrap}
    .optlist{display:grid;gap:10px}
    .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left}
    .badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:10px;border:1px solid var(--border);color:var(--muted);font-weight:800;flex:0 0 30px}
    .opt .txt{flex:1;white-space:pre-wrap}
    .opt.selected{border-color:rgba(74,163,255,.75);background:rgba(74,163,255,.10)}
    .opt.correct{border-color:rgba(46,204,113,.7);background:rgba(46,204,113,.10)}
    .opt.wrong{border-color:rgba(255,92,92,.75);background:rgba(255,92,92,.10)}
    .hint{margin:8px 0 0;color:var(--muted);font-size:13px}
    .statusline{margin:10px 0 0;color:var(--muted);font-size:14px}
    .statusline strong{color:var(--text)}
    .footer-watermark{position:fixed;left:0;right:0;bottom:0;padding:10px 14px;text-align:center;color:rgba(255,255,255,.35);font-size:13px;backdrop-filter:blur(10px);background:rgba(0,0,0,.35);border-top:1px solid rgba(255,255,255,.08)}
    .center{text-align:center}
    .big{font-size:22px;font-weight:800;margin:8px 0 0}
    .small{font-size:13px;color:var(--muted)}
    a{color:var(--accent)}

    /* confetti canvas */
    #confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;display:none}

    /* hype text */
    .hype{
      font-size:26px;font-weight:900;line-height:1.5;text-align:center;
      background:linear-gradient(135deg,#ffd700 0%,#ff6b6b 35%,#4aa3ff 65%,#2ecc71 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      margin:10px 0 6px;
      animation: hypepulse 1.8s ease-in-out infinite alternate;
    }
    @keyframes hypepulse{
      from{filter:brightness(1) drop-shadow(0 0 8px rgba(255,215,0,.4));}
      to{filter:brightness(1.25) drop-shadow(0 0 18px rgba(74,163,255,.6));}
    }

    /* BOSHLASH big button */
    #btnStart{
      font-size:22px;
      padding:18px;
      letter-spacing:1px;
      border-color:rgba(74,163,255,.65);
      background:rgba(74,163,255,.18);
      transition: background .2s, transform .1s;
    }
    #btnStart:hover{background:rgba(74,163,255,.28);transform:scale(1.02);}
    #btnStart:active{transform:scale(.98);}
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <div class="wrap">
    <div class="card" id="app">
      <div class="topbar">
        <div class="title" id="topTitle">Quiz</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
          <div class="pill" id="pillProg">Approved: <strong>0/25</strong> • Correct: <strong>0</strong></div>
          <div class="pill" id="pillTime">Time: <strong>40:00</strong></div>
        </div>
      </div>
      <div class="content" id="view"></div>
    </div>
  </div>

  <div class="footer-watermark">made by Eli Scott</div>

  <script src="questions.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    function shuffle(arr){
      for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
      return arr;
    }
    function pad2(n){return String(n).padStart(2,'0');}
    function formatTime(sec){
      const m=Math.floor(sec/60),s=sec%60;
      return `${pad2(m)}:${pad2(s)}`;
    }

    // ── state ──────────────────────────────────────────────
    const TOTAL_QUESTIONS = 25;
    const TIME_LIMIT_SEC  = 40 * 60;

    let state = {
      pool:[],queue:[],current:null,currentShuffled:[],
      selectedIdx:null,approved:0,correct:0,
      timer:TIME_LIMIT_SEC,timerHandle:null,
      phase:'start',checked:false,
    };

    function setTop(){
      $('pillProg').innerHTML=`Approved: <strong>${state.approved}/${TOTAL_QUESTIONS}</strong> • Correct: <strong>${state.correct}</strong>`;
      $('pillTime').innerHTML=`Time: <strong>${formatTime(state.timer)}</strong>`;
    }
    function stopTimer(){
      if(state.timerHandle){clearInterval(state.timerHandle);state.timerHandle=null;}
    }
    function startTimer(){
      stopTimer();
      state.timerHandle=setInterval(()=>{
        state.timer-=1; setTop();
        if(state.timer<=0){state.timer=0;setTop();finishQuiz(true);}
      },1000);
    }

    // ── confetti ───────────────────────────────────────────
    let confettiRaf=null;
    function startConfetti(){
      const canvas=$('confetti-canvas');
      canvas.style.display='block';
      canvas.width=window.innerWidth;
      canvas.height=window.innerHeight;
      const ctx=canvas.getContext('2d');
      const COLORS=['#ffd700','#ff6b6b','#4aa3ff','#2ecc71','#ff69b4','#ff8c00','#9b59b6','#ffffff'];
      const P=Array.from({length:200},()=>({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height-canvas.height,
        r:Math.random()*7+4,
        color:COLORS[Math.floor(Math.random()*COLORS.length)],
        speed:Math.random()*3.5+1.5,
        angle:Math.random()*Math.PI*2,
        spin:(Math.random()-.5)*.25,
        drift:(Math.random()-.5)*1.8,
        shape:Math.random()>.5?'rect':'circle',
        w:Math.random()*10+6,h:Math.random()*6+3,
      }));
      function draw(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        P.forEach(p=>{
          ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
          ctx.fillStyle=p.color;
          if(p.shape==='rect'){ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
          else{ctx.beginPath();ctx.arc(0,0,p.r/2,0,Math.PI*2);ctx.fill();}
          ctx.restore();
          p.y+=p.speed; p.x+=p.drift; p.angle+=p.spin;
          if(p.y>canvas.height+20){p.y=-20;p.x=Math.random()*canvas.width;}
        });
        confettiRaf=requestAnimationFrame(draw);
      }
      draw();
      setTimeout(stopConfetti,8000);
    }
    function stopConfetti(){
      if(confettiRaf){cancelAnimationFrame(confettiRaf);confettiRaf=null;}
      const c=$('confetti-canvas');if(c)c.style.display='none';
    }

    // ── audio ──────────────────────────────────────────────
    let cheerAudio=null;
    function playCheer(){
      cheerAudio=new Audio('https://assets.mixkit.co/sfx/preview/mixkit-crowd-cheering-and-clapping-476.mp3');
      cheerAudio.volume=0.85;
      cheerAudio.play().catch(()=>{});
      setTimeout(()=>{if(cheerAudio){cheerAudio.pause();cheerAudio=null;}},8000);
    }

    // ── views ──────────────────────────────────────────────
    function renderStart(){
      state.phase='start';
      stopTimer();stopConfetti();
      state.timer=TIME_LIMIT_SEC;state.approved=0;state.correct=0;
      setTop();
      $('topTitle').textContent='Quiz';
      $('view').innerHTML=`
        <div class="center">
          <div class="big" style="margin-bottom:10px;">Tayyor bo'lsangiz bosing</div>
          <div class="small">25 ta tasodifiy savol &nbsp;•&nbsp; 40 daqiqa</div>
        </div>
        <div style="height:20px"></div>
        <div class="btnrow">
          <button class="primary" id="btnStart">BOSHLASH</button>
        </div>
        <div class="hint">Maslahat: Telefondan kirmoqchi bo'lsangiz, sahifani Home Screen'ga qo'shing.</div>
      `;
      $('btnStart').onclick=()=>begin();
    }

    function begin(){
      const all=Array.isArray(window.QUESTIONS)?window.QUESTIONS:[];
      if(all.length<TOTAL_QUESTIONS){alert('Not enough questions loaded.');return;}
      const idx=shuffle([...Array(all.length).keys()]).slice(0,TOTAL_QUESTIONS);
      state.pool=idx.map(i=>all[i]);
      state.queue=[...state.pool];
      state.approved=0;state.correct=0;
      state.timer=TIME_LIMIT_SEC;state.checked=false;state.selectedIdx=null;
      state.phase='inQuiz';
      $('topTitle').textContent='Quiz';
      setTop();startTimer();nextQuestion();
    }

    function buildShuffledOptions(q){
      const correctKey=q.correct;
      return shuffle(Object.entries(q.options||{}).map(([k,text])=>({origKey:k,text,isCorrect:k===correctKey})));
    }

    function renderQuestion(){
      const q=state.current,opts=state.currentShuffled;
      state.selectedIdx=null;state.checked=false;setTop();
      const optHtml=opts.map((o,i)=>{
        const lbl=String.fromCharCode(65+i);
        return `<button class="opt" data-idx="${i}" aria-label="Option ${lbl}">
          <span class="badge">${lbl}</span><span class="txt">${escapeHtml(o.text)}</span>
        </button>`;
      }).join('');
      $('view').innerHTML=`
        <div class="statusline">
          Savol: <strong>${TOTAL_QUESTIONS-state.queue.length+1}</strong> / <strong>${TOTAL_QUESTIONS}</strong>
          <span style="opacity:.6">•</span> Approved: <strong>${state.approved}</strong>
          <span style="opacity:.6">•</span> Correct: <strong>${state.correct}</strong>
        </div>
        <div class="qtext">${escapeHtml(q.question)}</div>
        <div class="optlist" id="optlist">${optHtml}</div>
        <div style="height:12px"></div>
        <div class="btnrow">
          <button class="primary" id="btnApprove" disabled>Approve</button>
          <button id="btnSkip">Skip</button>
        </div>
        <div class="hint" id="hintArea">Javobni tanlang, so'ng Approve bosing.</div>
      `;
      const list=$('optlist');
      list.querySelectorAll('.opt').forEach(btn=>{
        btn.onclick=()=>{
          if(state.checked)return;
          state.selectedIdx=Number(btn.dataset.idx);
          list.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));
          btn.classList.add('selected');
          $('btnApprove').disabled=false;
        };
      });
      $('btnSkip').onclick=()=>{if(!state.checked){state.queue.push(q);nextQuestion();}};
      $('btnApprove').onclick=()=>{if(!state.checked){checkAnswer();}else{nextQuestion();}};
    }

    function checkAnswer(){
      if(state.selectedIdx===null)return;
      state.checked=true;state.approved+=1;
      const opts=state.currentShuffled,chosen=opts[state.selectedIdx];
      const correctIdx=opts.findIndex(o=>o.isCorrect);
      const btns=[...$('optlist').querySelectorAll('.opt')];
      btns.forEach(b=>b.disabled=true);
      $('btnSkip').disabled=true;
      if(correctIdx>=0)btns[correctIdx].classList.add('correct');
      let msg='';
      if(chosen&&chosen.isCorrect){state.correct+=1;msg='✓ To\'g\'ri!';}
      else{if(state.selectedIdx>=0)btns[state.selectedIdx].classList.add('wrong');msg='✗ Noto\'g\'ri';}
      setTop();
      $('hintArea').textContent=msg;
      $('btnApprove').textContent='Next';
      $('btnApprove').disabled=false;
      if(state.approved>=TOTAL_QUESTIONS)finishQuiz(false);
    }

    function nextQuestion(){
      if(state.phase!=='inQuiz')return;
      if(state.approved>=TOTAL_QUESTIONS){finishQuiz(false);return;}
      state.current=state.queue.shift();
      state.currentShuffled=buildShuffledOptions(state.current);
      $('btnApprove')&&($('btnApprove').textContent='Approve');
      renderQuestion();
    }

    function finishQuiz(timeout){
      if(state.phase==='finished')return;
      state.phase='finished';
      stopTimer();setTop();
      $('topTitle').textContent='Natija';
      const used=TIME_LIMIT_SEC-state.timer;
      const perfect=!timeout&&state.correct===TOTAL_QUESTIONS;

      if(perfect){startConfetti();playCheer();}

      $('view').innerHTML = perfect ? `
        <div style="height:8px"></div>
        <div class="hype">Qoyilmaqom!<br>Tabriklaymiz barcha savollarga to'g'ri javob berdingiz<br>Ota-onangizga rahmat!!!</div>
        <div style="height:10px"></div>
        <div class="card" style="border-radius:16px">
          <div class="content">
            <div class="statusline">To'g'ri javoblar: <strong>${state.correct} / ${TOTAL_QUESTIONS}</strong></div>
            <div class="statusline">Sarflangan vaqt: <strong>${formatTime(used)}</strong></div>
            <div class="statusline">Qolgan vaqt: <strong>${formatTime(state.timer)}</strong></div>
          </div>
        </div>
        <div style="height:12px"></div>
        <div class="btnrow">
          <button class="primary" id="btnRestart">Qayta boshlash</button>
        </div>
      ` : `
        <div class="center">
          <div class="big">${timeout?'⏰ Vaqt tugadi.':'Tugadi.'}</div>
        </div>
        <div style="height:14px"></div>
        <div class="card" style="border-radius:16px">
          <div class="content">
            <div class="statusline">Tasdiqlangan: <strong>${state.approved} / ${TOTAL_QUESTIONS}</strong></div>
            <div class="statusline">To'g'ri javoblar: <strong>${state.correct}</strong></div>
            <div class="statusline">Sarflangan vaqt: <strong>${formatTime(used)}</strong></div>
            <div class="statusline">Qolgan vaqt: <strong>${formatTime(state.timer)}</strong></div>
          </div>
        </div>
        <div style="height:12px"></div>
        <div class="btnrow">
          <button class="primary" id="btnRestart">Qayta boshlash</button>
        </div>
        <div class="hint">Qayta boshlash yangi 25 ta tasodifiy savol va aralashtirilgan variantlarni yaratadi.</div>
      `;

      $('btnRestart').onclick=()=>{
        stopConfetti();
        if(cheerAudio){cheerAudio.pause();cheerAudio=null;}
        begin();
      };
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;').replaceAll('<','&lt;')
        .replaceAll('>','&gt;').replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    renderStart();
  </script>
</body>
</html>
